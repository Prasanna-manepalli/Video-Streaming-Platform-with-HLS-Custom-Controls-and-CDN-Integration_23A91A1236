<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HLS Video Streaming Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="page-title">HLS Video Streaming Player</h1>

      <section class="player-section">
        <div class="video-container" id="video-container">
          <video
            id="video-player"
            class="video-element"
            playsinline
            crossorigin="anonymous"
          ></video>

          <div class="controls-container" aria-label="Video controls">
            <div class="controls-row">
              <button
                class="control-button"
                data-testid="play-pause-button"
                id="play-pause-button"
                aria-label="Play or pause video"
              >
                Play
              </button>

              <button
                class="control-button"
                data-testid="mute-button"
                id="mute-button"
                aria-label="Toggle mute"
              >
                Mute
              </button>

              <label class="slider-label" for="volume-slider">
                Volume
                <input
                  type="range"
                  id="volume-slider"
                  class="slider"
                  data-testid="volume-slider"
                  min="0"
                  max="1"
                  step="0.05"
                  value="1"
                  aria-label="Volume control"
                />
              </label>

              <button
                class="control-button"
                data-testid="fullscreen-button"
                id="fullscreen-button"
                aria-label="Toggle fullscreen"
              >
                Fullscreen
              </button>
            </div>

            <div class="controls-row">
              <label class="slider-label slider-label--wide" for="progress-bar">
                Progress
                <input
                  type="range"
                  id="progress-bar"
                  class="slider slider--progress"
                  data-testid="progress-bar"
                  min="0"
                  max="100"
                  step="0.1"
                  value="0"
                  aria-label="Seek through video"
                />
              </label>

              <label class="select-label" for="quality-selector">
                Quality
                <select
                  id="quality-selector"
                  class="select"
                  data-testid="quality-selector"
                  aria-label="Select video quality"
                >
                  <option value="auto">Auto</option>
                </select>
              </label>

              <label class="select-label" for="playback-speed-selector">
                Speed
                <select
                  id="playback-speed-selector"
                  class="select"
                  data-testid="playback-speed-selector"
                  aria-label="Select playback speed"
                >
                  <option value="0.5">0.5x</option>
                  <option value="0.75">0.75x</option>
                  <option value="1" selected>1x</option>
                  <option value="1.25">1.25x</option>
                  <option value="1.5">1.5x</option>
                  <option value="2">2x</option>
                </select>
              </label>

              <div
                id="current-bitrate-display"
                data-testid="current-bitrate-display"
                class="bitrate-display"
                aria-live="polite"
              >
                Bitrate: Auto
              </div>
            </div>
          </div>
        </div>

        <section class="instructions">
          <h2>Keyboard Shortcuts</h2>
          <ul>
            <li><strong>Space</strong>: Play / Pause</li>
            <li><strong>M</strong>: Mute / Unmute</li>
            <li><strong>F</strong>: Toggle Fullscreen</li>
            <li><strong>→</strong>: Seek forward 5 seconds</li>
            <li><strong>←</strong>: Seek backward 5 seconds</li>
            <li><strong>↑</strong>: Volume up</li>
            <li><strong>↓</strong>: Volume down</li>
          </ul>
        </section>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="config.js"></script>
    <script src="player.js"></script>
  </body>
  </html>
